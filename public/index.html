<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roshambo Wire Cutting</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e24;
      --accent-color: #ff4757;
      --text-color: #ffffff;
      --subtext-color: #a0a0a0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status-panel {
      background: #2a2a35;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1.1em;
    }

    .section-title {
      margin: 15px 0 10px 0;
      font-weight: 600;
      color: var(--subtext-color);
    }

    /* Roshambo Buttons */
    .rps-choices {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .rps-btn {
      background: #333342;
      border: 2px solid #44445a;
      color: #fff;
      font-size: 2rem;
      padding: 15px;
      border-radius: 50%;
      cursor: pointer;
      width: 70px;
      height: 70px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .rps-btn:hover:not(:disabled) {
      transform: scale(1.1);
      background: #4f4f6e;
    }

    .rps-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Wires Grid */
    .wires-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .wire-btn {
      height: 45px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      font-size: 1em;
      position: relative;
      transition: opacity 0.3s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wire-btn:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    .wire-btn:disabled {
      cursor: not-allowed;
    }

    .wire-btn.cut {
      background-color: #444 !important;
      color: #888;
      text-decoration: line-through;
      box-shadow: inset 0 0 10px #000;
    }

    .wire-btn.cut::after {
      content: '✂ CẮT';
      position: absolute;
      right: 15px;
      color: #ff4757;
      font-size: 0.8em;
      text-decoration: none;
    }

    /* Specific Wire Colors */
    .wire-0 { background-color: #e74c3c; }
    .wire-1 { background-color: #3498db; }
    .wire-2 { background-color: #2ecc71; }
    .wire-3 { background-color: #f1c40f; color: #000; }
    .wire-4 { background-color: #9b59b6; }

    /* Action / Restart Button */
    .reset-btn {
      margin-top: 25px;
      padding: 12px 24px;
      font-size: 1em;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .reset-btn:hover {
      background-color: #ff6b81;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>Wire Cutter</h1>
  
  <div class="status-panel" id="status-text">
    Hãy chọn Kéo, Búa hoặc Bao để đấu với Máy!
  </div>

  <div class="section-title">BƯỚC 1: OẰN TÙ TÌ</div>
  <div class="rps-choices">
    <button class="rps-btn" onclick="playRPS('rock')" id="btn-rock">✊</button>
    <button class="rps-btn" onclick="playRPS('paper')" id="btn-paper">✋</button>
    <button class="rps-btn" onclick="playRPS('scissors')" id="btn-scissors">✌️</button>
  </div>

  <div class="section-title">BƯỚC 2: CẮT DÂY (Cần thắng Oẳn tù tì)</div>
  <div class="wires-container" id="wires-grid">
    <!-- Dynamic Wires -->
  </div>

  <button class="reset-btn" onclick="initGame()">Chơi Lại</button>
</div>

<script>
  const TOTAL_WIRES = 5;
  let bombWireIndex = -1;
  let safeWiresRemaining = 0;
  let canCutWire = false;

  const statusText = document.getElementById('status-text');
  const wiresGrid = document.getElementById('wires-grid');
  
  const rpsButtons = [
    document.getElementById('btn-rock'),
    document.getElementById('btn-paper'),
    document.getElementById('btn-scissors')
  ];

  function initGame() {
    // 1. Reset variables
    bombWireIndex = Math.floor(Math.random() * TOTAL_WIRES);
    safeWiresRemaining = TOTAL_WIRES - 1;
    canCutWire = false;

    // 2. Reset UI Status
    statusText.innerText = "Hãy chọn Kéo, Búa hoặc Bao để đấu với Máy!";
    statusText.style.color = "#ffffff";

    // 3. Enable RPS Buttons
    setRPSActive(true);

    // 4. Render Wires
    wiresGrid.innerHTML = '';
    for (let i = 0; i < TOTAL_WIRES; i++) {
      const btn = document.createElement('button');
      btn.className = `wire-btn wire-${i}`;
      btn.innerText = `Sợi dây #${i + 1}`;
      btn.id = `wire-${i}`;
      btn.disabled = true; // Blocked until player wins RPS
      btn.onclick = () => cutWire(i);
      wiresGrid.appendChild(btn);
    }
  }

  function setRPSActive(active) {
    rpsButtons.forEach(btn => btn.disabled = !active);
  }

  function setWiresActive(active) {
    for (let i = 0; i < TOTAL_WIRES; i++) {
      const wire = document.getElementById(`wire-${i}`);
      if (!wire.classList.contains('cut')) {
        wire.disabled = !active;
      }
    }
  }

  function playRPS(playerChoice) {
    const choices = ['rock', 'paper', 'scissors'];
    const emojis = { rock: '✊', paper: '✋', scissors: '✌️' };
    const computerChoice = choices[Math.floor(Math.random() * choices.length)];

    let resultMsg = `Bạn: ${emojis[playerChoice]} vs Máy: ${emojis[computerChoice]} -> `;

    if (playerChoice === computerChoice) {
      statusText.innerText = resultMsg + "HÒA! Hãy đấu lại.";
      statusText.style.color = "#f1c40f";
    } else if (
      (playerChoice === 'rock' && computerChoice === 'scissors') ||
      (playerChoice === 'paper' && computerChoice === 'rock') ||
      (playerChoice === 'scissors' && computerChoice === 'paper')
    ) {
      statusText.innerText = resultMsg + "THẮNG! Chọn 1 sợi dây để cắt.";
      statusText.style.color = "#2ecc71";
      canCutWire = true;
      setRPSActive(false);
      setWiresActive(true);
    } else {
      statusText.innerText = resultMsg + "THUA! Máy đã chọn cắt giúp bạn...";
      statusText.style.color = "#e74c3c";
      setRPSActive(false);
      
      // Computer cuts a random available wire
      setTimeout(() => {
        botCutRandomWire();
      }, 1000);
    }
  }

  function cutWire(index) {
    const wireBtn = document.getElementById(`wire-${index}`);
    wireBtn.classList.add('cut');
    wireBtn.disabled = true;

    if (index === bombWireIndex) {
      // Hit Bomb
      statusText.innerText = "💥 BÙM! Bạn cắt trúng dây bom! GAME OVER.";
      statusText.style.color = "#ff4757";
      endGame();
    } else {
      // Safe Wire
      safeWiresRemaining--;
      if (safeWiresRemaining === 0) {
        statusText.innerText = "🎉 CHÚC MỪNG! Bạn đã vô hiệu hóa hoàn toàn quả bom!";
        statusText.style.color = "#2ecc71";
        endGame();
      } else {
        statusText.innerText = `An toàn! Cần cắt thêm ${safeWiresRemaining} dây nữa. Hãy đấu Oẳn tù tì tiếp.`;
        statusText.style.color = "#ffffff";
        canCutWire = false;
        setWiresActive(false);
        setRPSActive(true);
      }
    }
  }

  function botCutRandomWire() {
    let uncutIndices = [];
    for (let i = 0; i < TOTAL_WIRES; i++) {
      const wire = document.getElementById(`wire-${i}`);
      if (!wire.classList.contains('cut')) {
        uncutIndices.push(i);
      }
    }

    const randomIndex = uncutIndices[Math.floor(Math.random() * uncutIndices.length)];
    cutWire(randomIndex);
  }

  function endGame() {
    setRPSActive(false);
    setWiresActive(false);
  }

  // Run on load
  initGame();
</script>

</body>
</html>
