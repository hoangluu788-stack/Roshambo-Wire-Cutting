<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oẳn Tù Tì Cắt Dây - Cartoon Full Logic</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; user-select: none; }

    body {
      background: #3a88e9 linear-gradient(180deg, #5bb4ff 0%, #1e52ad 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 1100px;
      height: 640px;
      background: radial-gradient(circle at center, #6bc5ff 0%, #205bc7 100%);
      border: 6px solid #0e2a63;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .screen { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; padding:15px; }
    .screen.active { display: flex; flex-direction: column; justify-content: space-between; }

    /* HUD TOP BAR */
    .top-hud { display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .profile-card {
      background: #1b4594; border: 3px solid #0d285c; border-radius: 18px;
      padding: 6px 14px 6px 6px; display: flex; align-items: center; gap: 10px;
    }
    .avatar-frame { width: 50px; height: 50px; background: #ffd200; border: 3px solid #fff; border-radius: 12px; overflow: hidden; }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    
    .currency-group { display: flex; gap: 10px; }
    .currency-pill {
      background: #122b61; border: 2px solid #2d60bd; border-radius: 20px;
      padding: 4px 12px; display: flex; align-items: center; gap: 6px;
      font-family: 'Bungee'; font-size: 12px; color: #ffeb3b;
    }

    /* LOGO CHÍNH */
    .main-logo {
      font-family: 'Bungee', cursive; text-align: center; font-size: 32px; color: #fff200;
      text-shadow: 4px 4px 0 #b32d00, -2px -2px 0 #000;
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* MENU CHỌN */
    .mode-selection { display: flex; justify-content: center; gap: 25px; }
    .mode-card {
      width: 42%; height: 200px; border-radius: 24px; border: 5px solid #fff;
      cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end;
      align-items: center; padding-bottom: 20px; box-shadow: 0 12px 0 rgba(0,0,0,0.3);
    }
    .card-online { background: linear-gradient(180deg, #2bb1ff 0%, #005bb5 100%); }
    .card-friend { background: linear-gradient(180deg, #ffb700 0%, #d65900 100%); }

    .mode-btn-title {
      font-family: 'Bungee'; font-size: 20px; background: #fff; color: #000;
      padding: 6px 20px; border-radius: 30px; border: 3px solid #0d285c;
    }

    /* BATTLE ARENA & 10 DÂY */
    .battle-arena { display: flex; justify-content: space-between; align-items: center; height: 380px; }
    .wire-column { display: flex; flex-direction: column; gap: 6px; width: 220px; }
    .wire-item {
      height: 28px; background: linear-gradient(90deg, #ff3b3b, #b30000);
      border: 2px solid #fff; border-radius: 14px; display: flex;
      justify-content: space-between; align-items: center; padding: 0 10px;
      font-family: 'Bungee'; font-size: 11px; cursor: pointer;
    }
    .wire-item.blue { background: linear-gradient(90deg, #0099ff, #0044cc); }
    .wire-item.cut { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

    .timer-badge {
      font-family: 'Bungee'; font-size: 20px; background: #ff3366;
      border: 3px solid #fff; padding: 4px 16px; border-radius: 30px;
      box-shadow: 0 4px 0 #000; display: inline-block;
    }

    /* BET BAR */
    .bet-bar {
      background: #112652; border: 3px solid #2854ad; border-radius: 20px;
      padding: 8px 15px; display: flex; justify-content: space-between; align-items: center;
    }
    .btn-quick {
      background: linear-gradient(180deg, #ffcc00 0%, #d48800 100%);
      border: 2px solid #fff; border-radius: 12px; padding: 6px 14px;
      font-family: 'Bungee'; font-size: 12px; color: #000; cursor: pointer;
    }

    /* MODAL CHỌN DÂY CHẾT BAN ĐẦU */
    .modal-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
    }
    .grid-select-dead { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="game-container">

    <!-- TOP HUD -->
    <div class="top-hud">
      <div class="profile-card">
        <div class="avatar-frame"><img id="myAvatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=ProPlayer&backgroundColor=b6e3f4"></div>
        <div style="display:flex; flex-direction:column;">
          <span style="font-family:'Bungee'; font-size:13px;" id="myPlayerName">Player_Pro</span>
          <span style="font-size:10px; color:#a2c4ff;" id="roleTxt">Vai trò: Người chơi</span>
        </div>
      </div>
      <div class="currency-group">
        <div class="currency-pill">🪙 <span id="txtCoins">5000</span></div>
      </div>
    </div>

    <!-- MAIN MENU -->
    <div class="screen active" id="screenMenu">
      <div class="main-logo">OẮN TÙ TÌ<br><span style="color:#00ff66;">CẮT DÂY</span></div>
      <div class="mode-selection">
        <div class="mode-card card-online" onclick="enterRoom('player')">
          <div style="font-size: 50px; margin-bottom: 10px;">🎮</div>
          <button class="mode-btn-title">VÀO CHƠI (2 Người)</button>
        </div>
        <div class="mode-card card-friend" onclick="enterRoom('spectator')">
          <div style="font-size: 50px; margin-bottom: 10px;">👁️</div>
          <button class="mode-btn-title">KHÁN GIẢ (-10 Xu)</button>
        </div>
      </div>
    </div>

    <!-- BATTLE SCREEN -->
    <div class="screen" id="screenBattle">
      <div style="display:flex; justify-content:space-between; align-items:center; z-index:5;">
        <span style="font-family:'Bungee'; color:#ffeb3b; font-size:14px;" id="statusMsg">Đang chờ đủ 2 người chơi...</span>
        <div class="timer-badge" id="timerTxt">⏱️ 15s</div>
        <button onclick="leaveBattle()" class="btn-quick" style="background:#ff3366; color:#fff;">Thoát</button>
      </div>

      <div class="battle-arena">
        <div class="wire-column" id="p1WireCol"></div>
        <div style="text-align:center;">
          <div id="handP1" style="font-size:70px;">✋</div>
          <div style="font-family:'Bungee'; font-size:20px; color:#ffeb3b;">VS</div>
          <div id="handP2" style="font-size:70px;">✊</div>
        </div>
        <div class="wire-column" id="p2WireCol"></div>
      </div>

      <!-- ĐẶT CƯỢC VÀ CHỌN NÚT -->
      <div class="bet-bar" id="rpsActionBar">
        <div style="font-family:'Bungee'; font-size:12px;" id="spectatorBetInfo">Cược Khán Giả: 100 Xu</div>
        <div style="display:flex; gap:8px;" id="rpsBtnGroup">
          <button class="btn-quick" onclick="chooseRPS('rock')">✊ Búa</button>
          <button class="btn-quick" onclick="chooseRPS('paper')">✋ Bao</button>
          <button class="btn-quick" onclick="chooseRPS('scissors')">✌️ Kéo</button>
        </div>
      </div>
    </div>

    <!-- MODAL CHỌN DÂY CHẾT -->
    <div class="modal-overlay" id="deadWireModal" style="display:none;">
      <h2 style="font-family:'Bungee'; color:#ffeb3b;">💣 CHỌN DÂY CHẾT BÍ MẬT CỦA BẠN (1-10)</h2>
      <div class="grid-select-dead" id="deadWireGrid"></div>
    </div>

  </div>

  <script>
    let coins = 5000;
    let role = 'player';
    let playerCount = 1; // Giả lập phòng đủ 2 người
    let myDeadWire = null;
    let spectatorBetOn = 'P1'; // Khán giả đặt P1 hoặc P2
    let timer = 15;
    let timerInterval = null;
    let myChoice = null;

    function enterRoom(selectedRole) {
      role = selectedRole;
      document.getElementById('screenMenu').classList.remove('active');
      document.getElementById('screenBattle').classList.add('active');

      if (role === 'spectator') {
        coins -= 10;
        document.getElementById('txtCoins').innerText = coins;
        document.getElementById('roleTxt').innerText = "Vai trò: Khán Giả (-10 Xu)";
        document.getElementById('rpsBtnGroup').style.display = 'none';
        document.getElementById('statusMsg').innerText = "👁️ BẠN DỰ ĐOÁN P1 HAY P2 THẮNG?";
        initWires();
        startPreparationCountdown();
      } else {
        document.getElementById('roleTxt').innerText = "Vai trò: Người Chơi";
        // Hiện Modal chọn dây chết trước khi đấu
        openDeadWireModal();
      }
    }

    function openDeadWireModal() {
      const modal = document.getElementById('deadWireModal');
      const grid = document.getElementById('deadWireGrid');
      modal.style.display = 'flex';
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-quick';
        btn.innerText = 'Dây ' + i;
        btn.onclick = () => {
          myDeadWire = i;
          modal.style.display = 'none';
          initWires();
          checkCanStartGame();
        };
        grid.appendChild(btn);
      }
    }

    function checkCanStartGame() {
      // Giả lập chờ đủ 2 người
      if (playerCount < 2) {
        document.getElementById('statusMsg').innerText = "⏳ Chưa đủ 2 người chơi. Đang chờ người chơi 2...";
        setTimeout(() => {
          playerCount = 2;
          document.getElementById('statusMsg').innerText = "✅ Đã đủ 2 người chơi! Bắt đầu lượt Oẳn Tù Tì!";
          start15sTimer();
        }, 2000);
      } else {
        start15sTimer();
      }
    }

    function start15sTimer() {
      timer = 15;
      myChoice = null;
      document.getElementById('timerTxt').innerText = `⏱️ ${timer}s`;
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timer--;
        document.getElementById('timerTxt').innerText = `⏱️ ${timer}s`;

        if (timer <= 0) {
          clearInterval(timerInterval);
          if (!myChoice && role === 'player') {
            // Tự động ra ngẫu nhiên khi hết 15s
            const choices = ['rock', 'paper', 'scissors'];
            myChoice = choices[Math.floor(Math.random() * 3)];
            document.getElementById('statusMsg').innerText = "⚠️ Hết 15s! Hệ thống tự động chọn cho bạn!";
          }
          resolveRPS();
        }
      }, 1000);
    }

    function chooseRPS(choice) {
      myChoice = choice;
      document.getElementById('statusText');
      document.getElementById('statusMsg').innerText = "✅ Đã chốt đáp án! Đang chờ đối thủ...";
    }

    function resolveRPS() {
      const choices = ['rock', 'paper', 'scissors'];
      const icons = { rock: '✊', paper: '✋', scissors: '✌️' };
      const oppChoice = choices[Math.floor(Math.random() * 3)];

      document.getElementById('handP1').innerText = icons[myChoice || 'rock'];
      document.getElementById('handP2').innerText = icons[oppChoice];

      // Giả lập kết quả P1 thắng
      document.getElementById('statusMsg').innerText = "🎉 P1 THẮNG OẮN TÙ TÌ! Tiến hành trả tiền cược khán giả...";
      
      // Trả tiền cược cho khán giả
      if (role === 'spectator' && spectatorBetOn === 'P1') {
        coins += 200; // Trả thưởng Khán giả
        document.getElementById('txtCoins').innerText = coins;
      }

      // Đếm ngược 10s chuẩn bị cho vòng tiếp theo
      start10sPreparation();
    }

    function start10sPreparation() {
      let prepTime = 10;
      document.getElementById('timerTxt').innerText = `🔄 Chuẩn bị: ${prepTime}s`;
      
      const prepInterval = setInterval(() => {
        prepTime--;
        document.getElementById('timerTxt').innerText = `🔄 Chuẩn bị: ${prepTime}s`;
        if (prepTime <= 0) {
          clearInterval(prepInterval);
          start15sTimer(); // Sang vòng đấu mới
        }
      }, 1000);
    }

    function initWires() {
      const p1Col = document.getElementById('p1WireCol');
      const p2Col = document.getElementById('p2WireCol');
      p1Col.innerHTML = ''; p2Col.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const w1 = document.createElement('div');
        w1.className = 'wire-item blue';
        w1.innerText = '⚡ DÂY ' + i;
        p1Col.appendChild(w1);

        const w2 = document.createElement('div');
        w2.className = 'wire-item';
        w2.innerText = 'DÂY ' + i + ' ✂️';
        p2Col.appendChild(w2);
      }
    }

    function leaveBattle() {
      clearInterval(timerInterval);
      document.getElementById('screenBattle').classList.remove('active');
      document.getElementById('screenMenu').classList.add('active');
    }
  </script>
</body>
</html>
