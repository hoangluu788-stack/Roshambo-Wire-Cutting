<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oẳn Tù Tì Cắt Dây - FULL LOGIC + CHAT & EMOTE</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; user-select: none; }

    body {
      background: #3a88e9 linear-gradient(180deg, #5bb4ff 0%, #1e52ad 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 1150px;
      height: 680px;
      background: radial-gradient(circle at center, #6bc5ff 0%, #205bc7 100%);
      border: 6px solid #0e2a63;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .screen { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; padding:15px; }
    .screen.active { display: flex; flex-direction: column; justify-content: space-between; }

    /* HUD TOP BAR */
    .top-hud { display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .profile-card {
      background: #1b4594; border: 3px solid #0d285c; border-radius: 18px;
      padding: 6px 14px 6px 6px; display: flex; align-items: center; gap: 10px;
    }
    .avatar-frame { width: 45px; height: 45px; background: #ffd200; border: 3px solid #fff; border-radius: 12px; overflow: hidden; }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    
    .currency-pill {
      background: #122b61; border: 2px solid #2d60bd; border-radius: 20px;
      padding: 4px 12px; display: flex; align-items: center; gap: 6px;
      font-family: 'Bungee'; font-size: 12px; color: #ffeb3b;
    }

    .main-logo {
      font-family: 'Bungee', cursive; text-align: center; font-size: 32px; color: #fff200;
      text-shadow: 4px 4px 0 #b32d00, -2px -2px 0 #000;
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* LOBBY CHỌN & NHẬP PHÒNG */
    .lobby-box {
      background: rgba(13, 33, 74, 0.88);
      border: 4px solid #2d60bd;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 480px;
      margin: 0 auto;
    }

    .room-input {
      width: 85%;
      padding: 10px;
      border-radius: 14px;
      border: 3px solid #ffd200;
      font-family: 'Bungee';
      font-size: 18px;
      text-align: center;
      outline: none;
      background: #091738;
      color: #fff;
    }

    .btn-action {
      background: linear-gradient(180deg, #ffcc00 0%, #d48800 100%);
      border: 3px solid #fff; border-radius: 16px; padding: 10px 20px;
      font-family: 'Bungee'; font-size: 14px; color: #000; cursor: pointer;
      box-shadow: 0 4px 0 #8c5a00; transition: transform 0.1s;
      width: 85%;
    }
    .btn-action:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c5a00; }
    .btn-blue { background: linear-gradient(180deg, #00d2ff 0%, #0066cc 100%); color: #fff; box-shadow: 0 4px 0 #003366; }
    .btn-purple { background: linear-gradient(180deg, #d23bff 0%, #7b00b8 100%); color: #fff; box-shadow: 0 4px 0 #430063; }

    /* LAYOUT BÀN ĐẤU & CHAT */
    .battle-main-layout { display: flex; gap: 15px; height: 480px; }
    .arena-section { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    
    /* BẢNG CHAT */
    .chat-section {
      width: 280px; background: rgba(10, 24, 56, 0.9);
      border: 3px solid #2854ad; border-radius: 20px;
      display: flex; flex-direction: column; padding: 10px; gap: 8px;
    }
    .chat-title { font-family: 'Bungee'; font-size: 12px; color: #ffeb3b; text-align: center; }
    .chat-messages {
      flex: 1; overflow-y: auto; background: #061026; border-radius: 12px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12px;
    }
    .chat-msg-item { background: #162f63; padding: 5px 8px; border-radius: 8px; word-break: break-word; }
    .chat-input-row { display: flex; gap: 5px; }
    .chat-input {
      flex: 1; background: #091738; border: 2px solid #2854ad;
      border-radius: 10px; color: #fff; padding: 6px; font-size: 12px; outline: none;
    }

    /* BÀN CẮT DÂY */
    .battle-arena { display: flex; justify-content: space-between; align-items: center; height: 320px; }
    .wire-column { display: flex; flex-direction: column; gap: 5px; width: 180px; }
    .wire-item {
      height: 26px; background: linear-gradient(90deg, #ff3b3b, #b30000);
      border: 2px solid #fff; border-radius: 14px; display: flex;
      justify-content: space-between; align-items: center; padding: 0 10px;
      font-family: 'Bungee'; font-size: 10px; cursor: pointer;
    }
    .wire-item.blue { background: linear-gradient(90deg, #0099ff, #0044cc); }

    .timer-badge {
      font-family: 'Bungee'; font-size: 16px; background: #ff3366;
      border: 3px solid #fff; padding: 4px 14px; border-radius: 30px;
    }

    .bet-bar {
      background: #112652; border: 3px solid #2854ad; border-radius: 20px;
      padding: 8px 15px; display: flex; justify-content: space-between; align-items: center;
    }

    /* BẢNG EMOTE */
    .emote-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .btn-emote {
      background: #1b3d82; border: 2px solid #3b6ed4; border-radius: 10px;
      padding: 4px 8px; font-size: 18px; cursor: pointer; transition: transform 0.1s;
    }
    .btn-emote:hover { transform: scale(1.2); }

    /* POPUP BONG BÓNG EMOTE */
    .emote-pop {
      position: absolute; font-size: 50px; animation: popUpAnim 1.5s ease-out forwards;
      pointer-events: none; z-index: 99;
    }
    @keyframes popUpAnim {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-60px) scale(1); }
    }

    /* MODAL */
    .modal-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
    }
    .grid-select-dead { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="game-container">

    <!-- TOP HUD -->
    <div class="top-hud">
      <div class="profile-card">
        <div class="avatar-frame"><img id="myAvatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=ProPlayer&backgroundColor=b6e3f4"></div>
        <div style="display:flex; flex-direction:column;">
          <span style="font-family:'Bungee'; font-size:13px;" id="myPlayerName">Player_Pro</span>
          <span style="font-size:10px; color:#a2c4ff;" id="roleTxt">Chưa vào phòng</span>
        </div>
      </div>
      <div class="currency-pill">🪙 <span id="txtCoins">10,000</span></div>
    </div>

    <!-- MÀN HÌNH TẠO / NHẬP PHÒNG -->
    <div class="screen active" id="screenMenu">
      <div class="main-logo">OẮN TÙ TÌ<br><span style="color:#00ff66;">CẮT DÂY</span></div>

      <div class="lobby-box">
        <h3 style="font-family:'Bungee'; color:#ffeb3b; font-size:14px;">1. TẠO PHÒNG MỚI</h3>
        <div style="display:flex; gap:10px; width:85%;">
          <button class="btn-action" style="flex:1;" onclick="createNewRoom('player')">🎮 LÀM NGƯỜI CHƠI</button>
          <button class="btn-action btn-purple" style="flex:1;" onclick="createNewRoom('spectator')">👁️ LÀM KHÁN GIẢ</button>
        </div>

        <div style="width:100%; border-top: 2px dashed #2d60bd; margin: 4px 0;"></div>

        <h3 style="font-family:'Bungee'; color:#ffeb3b; font-size:14px;">2. NHẬP MÃ PHÒNG CÓ SẴN</h3>
        <input type="text" id="inputRoomId" class="room-input" placeholder="NHẬP MÃ 4 SỐ" maxlength="4">
        
        <div style="display:flex; gap:10px; width:85%;">
          <button class="btn-action btn-blue" style="flex:1;" onclick="joinRoom('player')">VÀO CHƠI</button>
          <button class="btn-action btn-purple" style="flex:1;" onclick="joinRoom('spectator')">VÀO XEM</button>
        </div>
      </div>
    </div>

    <!-- MÀN HÌNH BÀN ĐẤU -->
    <div class="screen" id="screenBattle">
      <div style="display:flex; justify-content:space-between; align-items:center; z-index:5;">
        <div style="display:flex; gap:10px; align-items:center;">
          <span style="font-family:'Bungee'; background:#183875; padding:4px 12px; border-radius:12px; border:2px solid #fff;" id="roomDisplayCode">MÃ: ----</span>
          <span style="font-family:'Bungee'; color:#ffeb3b; font-size:12px;" id="statusMsg">Đang chờ đủ 2 người chơi...</span>
        </div>
        
        <!-- NÚT XIN LÀM NGƯỜI CHƠI (HIỆN KHI LÀ KHÁN GIẢ) -->
        <button id="btnRequestPlay" onclick="requestToPlay()" class="btn-action btn-purple" style="width:auto; padding:4px 12px; font-size:11px; display:none;">✋ XIN LÀM NGƯỜI CHƠI</button>
        
        <div class="timer-badge" id="timerTxt">⏱️ 15s</div>
        <button onclick="leaveBattle()" class="btn-action" style="width:auto; padding:4px 12px; background:#ff3366; color:#fff; font-size:11px;">Thoát</button>
      </div>

      <div class="battle-main-layout">
        <!-- ARENA CẮT DÂY -->
        <div class="arena-section">
          <div class="battle-arena" id="arenaBox">
            <div class="wire-column" id="p1WireCol"></div>
            <div style="text-align:center;">
              <div id="handP1" style="font-size:60px;">✋</div>
              <div style="font-family:'Bungee'; font-size:18px; color:#ffeb3b;">VS</div>
              <div id="handP2" style="font-size:60px;">✊</div>
            </div>
            <div class="wire-column" id="p2WireCol"></div>
          </div>

          <!-- EMOTE BAR & ACTION -->
          <div class="bet-bar">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:10px; color:#a2c4ff;">Gửi Emote trêu ghẹo:</span>
              <div class="emote-bar">
                <button class="btn-emote" onclick="sendEmote('🤡')">🤡</button>
                <button class="btn-emote" onclick="sendEmote('🤣')">🤣</button>
                <button class="btn-emote" onclick="sendEmote('💩')">💩</button>
                <button class="btn-emote" onclick="sendEmote('💣')">💣</button>
                <button class="btn-emote" onclick="sendEmote('✂️')">✂️</button>
              </div>
            </div>

            <div style="display:flex; gap:6px;" id="rpsBtnGroup">
              <button class="btn-action" style="width:auto; padding:6px 12px; font-size:11px;" onclick="chooseRPS('rock')">✊ Búa</button>
              <button class="btn-action" style="width:auto; padding:6px 12px; font-size:11px;" onclick="chooseRPS('paper')">✋ Bao</button>
              <button class="btn-action" style="width:auto; padding:6px 12px; font-size:11px;" onclick="chooseRPS('scissors')">✌️ Kéo</button>
            </div>
          </div>
        </div>

        <!-- KHUNG CHAT RIÊNG -->
        <div class="chat-section">
          <div class="chat-title">💬 CHAT TRONG PHÒNG</div>
          <div class="chat-messages" id="chatBox">
            <div class="chat-msg-item"><b>Hệ thống:</b> Chào mừng bạn vào phòng!</div>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" class="chat-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="btn-action" style="width:auto; padding:4px 10px; font-size:11px;" onclick="sendChatMessage()">Gửi</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL CHỌN DÂY CHẾT -->
    <div class="modal-overlay" id="deadWireModal" style="display:none;">
      <h2 style="font-family:'Bungee'; color:#ffeb3b;">💣 CHỌN DÂY CHẾT BÍ MẬT (1-10)</h2>
      <div class="grid-select-dead" id="deadWireGrid"></div>
    </div>

    <!-- MODAL YÊU CẦU ĐỔI CHỖ -->
    <div class="modal-overlay" id="swapRequestModal" style="display:none;">
      <h3 style="font-family:'Bungee'; color:#ffeb3b; text-align:center;" id="swapMsgTxt">Khán giả muốn xin đổi chỗ làm Người chơi!</h3>
      <div style="display:flex; gap:15px; margin-top:20px;">
        <button class="btn-action" style="width:auto; padding:8px 20px;" onclick="acceptSwap(true)">ĐỒNG Ý</button>
        <button class="btn-action" style="width:auto; padding:8px 20px; background:#ff3366; color:#fff;" onclick="acceptSwap(false)">TỪ CHỐI</button>
      </div>
    </div>

  </div>

  <script>
    let coins = 10000;
    let role = 'player';
    let currentRoomId = null;
    let playersInRoom = 1;
    let myDeadWire = null;
    let timer = 15;
    let timerInterval = null;
    let myChoice = null;

    // --- TẠO VÀ NHẬP PHÒNG ---
    function createNewRoom(selectedRole) {
      currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
      enterBattleRoom(currentRoomId, selectedRole);
    }

    function joinRoom(selectedRole) {
      const roomInput = document.getElementById('inputRoomId').value.trim();
      if (!roomInput || roomInput.length < 4) {
        alert("Vui lòng nhập mã phòng 4 chữ số!");
        return;
      }
      currentRoomId = roomInput;
      enterBattleRoom(currentRoomId, selectedRole);
    }

    function enterBattleRoom(roomId, userRole) {
      role = userRole;
      document.getElementById('screenMenu').classList.remove('active');
      document.getElementById('screenBattle').classList.add('active');
      document.getElementById('roomDisplayCode').innerText = "MÃ: " + roomId;

      if (role === 'spectator') {
        document.getElementById('roleTxt').innerText = "Khán Giả (Phòng " + roomId + ")";
        document.getElementById('rpsBtnGroup').style.display = 'none';
        document.getElementById('btnRequestPlay').style.display = 'block';
        initWires();
        addChatMessage("Hệ thống", "Bạn tham gia với vai trò Khán giả.");
        start10sPreparation();
      } else {
        document.getElementById('roleTxt').innerText = "Người Chơi (Phòng " + roomId + ")";
        document.getElementById('rpsBtnGroup').style.display = 'flex';
        document.getElementById('btnRequestPlay').style.display = 'none';
        openDeadWireModal();
      }
    }

    // --- CHỌN DÂY CHẾT & KIỂM TRA NGƯỜI CHƠI ---
    function openDeadWireModal() {
      const modal = document.getElementById('deadWireModal');
      const grid = document.getElementById('deadWireGrid');
      modal.style.display = 'flex';
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.style.width = 'auto';
        btn.innerText = 'Dây ' + i;
        btn.onclick = () => {
          myDeadWire = i;
          modal.style.display = 'none';
          initWires();
          checkRoomPlayers();
        };
        grid.appendChild(btn);
      }
    }

    function checkRoomPlayers() {
      document.getElementById('statusMsg').innerText = "⏳ Đang đợi đối thủ vào phòng " + currentRoomId + "...";
      setTimeout(() => {
        playersInRoom = 2;
        document.getElementById('statusMsg').innerText = "✅ Đã đủ 2 người! Bắt đầu lượt 15s!";
        start15sTimer();
      }, 2000);
    }

    // --- XIN LÀM NGƯỜI CHƠI & ĐỔI CHỖ ---
    function requestToPlay() {
      addChatMessage("Bạn", "Đã gửi yêu cầu xin làm Người chơi...");
      // Giả lập hiện thông báo xin đổi chỗ ở phía Người chơi
      setTimeout(() => {
        if (role === 'player') {
          document.getElementById('swapRequestModal').style.display = 'flex';
        } else {
          // Giả lập Người chơi đồng ý đổi chỗ
          alert("Người chơi đã ĐỒNG Ý đổi chỗ cho bạn!");
          role = 'player';
          enterBattleRoom(currentRoomId, 'player');
        }
      }, 1000);
    }

    function acceptSwap(isAccepted) {
      document.getElementById('swapRequestModal').style.display = 'none';
      if (isAccepted) {
        addChatMessage("Hệ thống", "Bạn đã đồng ý đổi chỗ cho Khán giả!");
        role = 'spectator';
        enterBattleRoom(currentRoomId, 'spectator');
      } else {
        addChatMessage("Hệ thống", "Bạn đã từ chối yêu cầu đổi chỗ.");
      }
    }

    // --- ĐẾM NGƯỢC 15S & XỬ LÝ OẮN TÙ TÌ ---
    function start15sTimer() {
      timer = 15;
      myChoice = null;
      document.getElementById('timerTxt').innerText = `⏱️ ${timer}s`;
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timer--;
        document.getElementById('timerTxt').innerText = `⏱️ ${timer}s`;

        if (timer <= 0) {
          clearInterval(timerInterval);
          if (!myChoice && role === 'player') {
            const choices = ['rock', 'paper', 'scissors'];
            myChoice = choices[Math.floor(Math.random() * 3)];
            document.getElementById('statusMsg').innerText = "⚠️ Tự động ra bài ngẫu nhiên!";
          }
          resolveRPS();
        }
      }, 1000);
    }

    function chooseRPS(choice) {
      myChoice = choice;
      document.getElementById('statusMsg').innerText = "✅ Đã chốt đòn!";
    }

    function resolveRPS() {
      const choices = ['rock', 'paper', 'scissors'];
      const icons = { rock: '✊', paper: '✋', scissors: '✌️' };
      const oppChoice = choices[Math.floor(Math.random() * 3)];

      document.getElementById('handP1').innerText = icons[myChoice || 'rock'];
      document.getElementById('handP2').innerText = icons[oppChoice];

      document.getElementById('statusMsg').innerText = "🎉 Hoàn tất lượt đấu! Chuẩn bị lượt mới...";
      start10sPreparation();
    }

    function start10sPreparation() {
      let prepTime = 10;
      document.getElementById('timerTxt').innerText = `🔄 Chuẩn bị: ${prepTime}s`;
      
      const prepInterval = setInterval(() => {
        prepTime--;
        document.getElementById('timerTxt').innerText = `🔄 Chuẩn bị: ${prepTime}s`;
        if (prepTime <= 0) {
          clearInterval(prepInterval);
          if (role === 'player') start15sTimer();
        }
      }, 1000);
    }

    // --- CHAT & EMOTE TRÊU GHẸO ---
    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      addChatMessage("Bạn", text);
      input.value = '';
    }

    function addChatMessage(sender, text) {
      const chatBox = document.getElementById('chatBox');
      const msgItem = document.createElement('div');
      msgItem.className = 'chat-msg-item';
      msgItem.innerHTML = `<b>${sender}:</b> ${text}`;
      chatBox.appendChild(msgItem);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendEmote(emoji) {
      // Bắn emote trực tiếp lên màn hình arena
      const arena = document.getElementById('arenaBox');
      const pop = document.createElement('div');
      pop.className = 'emote-pop';
      pop.innerText = emoji;
      pop.style.left = (Math.random() * 60 + 20) + '%';
      pop.style.top = (Math.random() * 40 + 30) + '%';
      arena.appendChild(pop);

      setTimeout(() => pop.remove(), 1500);
    }

    function initWires() {
      const p1Col = document.getElementById('p1WireCol');
      const p2Col = document.getElementById('p2WireCol');
      p1Col.innerHTML = ''; p2Col.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const w1 = document.createElement('div');
        w1.className = 'wire-item blue';
        w1.innerText = '⚡ DÂY ' + i;
        p1Col.appendChild(w1);

        const w2 = document.createElement('div');
        w2.className = 'wire-item';
        w2.innerText = 'DÂY ' + i + ' ✂️';
        p2Col.appendChild(w2);
      }
    }

    function leaveBattle() {
      clearInterval(timerInterval);
      document.getElementById('screenBattle').classList.remove('active');
      document.getElementById('screenMenu').classList.add('active');
      document.getElementById('roleTxt').innerText = "Chưa vào phòng";
    }
  </script>
</body>
</html>
