<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oẳn Tù Tì Cắt Dây 10 Dây - Chibi Chill Edition</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap');

    :root {
      --bg-main: #0f111a;
      --card-bg: #1c1e2e;
      --accent-yellow: #ffcc00;
      --accent-red: #ff3366;
      --accent-blue: #00d2ff;
      --accent-green: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

    body {
      background: radial-gradient(circle at center, #1b1e31 0%, #08090e 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 4px solid #2d324d;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      font-family: 'Bungee', cursive;
      color: var(--accent-yellow);
      font-size: 22px;
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 10px;
    }

    /* TOP BAR: WALLET, GOOGLE & MUSIC TOGGLE */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121420;
      padding: 8px 15px;
      border-radius: 50px;
      margin-bottom: 15px;
      border: 2px solid #282c44;
    }

    .coin-badge {
      font-weight: 900;
      color: var(--accent-yellow);
      font-size: 15px;
    }

    .btn-music {
      background: #282c44;
      border: 2px solid var(--accent-blue);
      color: #fff;
      border-radius: 50px;
      padding: 4px 12px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ARENA CHIBI PLAYERS */
    .arena {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      background: #121420;
      padding: 12px;
      border-radius: 20px;
      border: 2px solid #282c44;
    }

    .chibi-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 42%;
    }

    .chibi-img {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 3px solid var(--accent-yellow);
      background: #2a2e45;
      object-fit: cover;
    }

    .player-tag {
      margin-top: 5px;
      font-weight: 900;
      font-size: 13px;
      color: var(--accent-blue);
    }

    /* BETTING & MODE SELECTION */
    .setup-panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .bet-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .btn-bet {
      background: #282c44;
      border: 2px solid #3d446b;
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-bet.active {
      background: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
    }

    /* WIRE GRID 10 DÂY */
    .wire-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .btn-wire-10 {
      background: linear-gradient(180deg, #ff4757, #c0392b);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 900;
      padding: 10px 0;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    .btn-wire-10:disabled {
      background: #444;
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-action {
      font-family: 'Bungee', cursive;
      width: 100%;
      background: var(--accent-green);
      color: #000;
      padding: 12px;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 5px 0 #00ab55;
      margin-top: 8px;
    }

    .status-msg {
      font-weight: 900;
      font-size: 14px;
      color: var(--accent-blue);
      margin: 10px 0;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>✂️ OẮN TÙ TÌ CẮT DÂY 💣</h1>

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="coin-badge">💰 Xu: <span id="userCoins">5000</span></div>
      <button class="btn-music" id="musicBtn" onclick="toggleMusic()">🎵 Nhạc: Bật</button>
      <div id="authBox">
        <div id="g_id_onload"
          data-client_id="624410093822-dmhrvoeg1pk0lr474vp4pu1qbet332d9.apps.googleusercontent.com"
          data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="icon" data-shape="circle"></div>
      </div>
    </div>

    <!-- SÂN ĐẤU -->
    <div class="arena">
      <div class="chibi-box">
        <img id="p1Avatar" class="chibi-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=P1&backgroundColor=b6e3f4">
        <div id="p1Name" class="player-tag">Bạn (Người chơi)</div>
      </div>
      <div style="font-family:'Bungee'; color:var(--accent-red);">VS</div>
      <div class="chibi-box">
        <img id="p2Avatar" class="chibi-img" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Guest&backgroundColor=ffdfbf">
        <div id="p2Name" class="player-tag">Khách (-10 Xu)</div>
      </div>
    </div>

    <!-- CHỌN CHẾ ĐỘ & MỨC CƯỢC -->
    <div class="setup-panel" id="setupPanel">
      <p style="font-weight:900; font-size:13px;">1. Chọn Mức Cược Xu:</p>
      <div class="bet-options">
        <button class="btn-bet active" onclick="selectBet(1)">1</button>
        <button class="btn-bet" onclick="selectBet(5)">5</button>
        <button class="btn-bet" onclick="selectBet(10)">10</button>
        <button class="btn-bet" onclick="selectBet(50)">50</button>
        <button class="btn-bet" onclick="selectBet(100)">100</button>
        <button class="btn-bet" onclick="selectBet(500)">500</button>
        <button class="btn-bet" onclick="selectBet(1000)">1000</button>
        <button class="btn-bet" onclick="selectBet(5000)">5000</button>
      </div>

      <p style="font-weight:900; font-size:13px; margin-top:10px;">2. Vô Phòng Với Vai Trò:</p>
      <div style="display:flex; gap:10px; margin-top:5px;">
        <button class="btn-action" style="background:var(--accent-yellow); box-shadow:0 4px 0 #c7a000;" onclick="joinGame('player')">🎮 Người Chơi</button>
        <button class="btn-action" style="background:#74b9ff; box-shadow:0 4px 0 #0984e3;" onclick="joinGame('spectator')">👁️ Khán Giả (-10 Xu)</button>
      </div>
    </div>

    <div id="statusText" class="status-msg">Nút nhạc ở góc trên, bấm chơi ngay!</div>

    <!-- KHU VỰC CẮT 10 DÂY -->
    <div class="wire-grid" id="wireGrid" style="display:none;"></div>

    <!-- NÚT OẮN TÙ TÌ -->
    <div id="rpsButtons" style="display:none; gap:10px; margin-top:10px;">
      <button class="btn-action" onclick="playRPS('rock')">✊ Búa</button>
      <button class="btn-action" onclick="playRPS('paper')">✋ Bao</button>
      <button class="btn-action" onclick="playRPS('scissors')">✌️ Kéo</button>
    </div>
  </div>

  <script>
    // --- TRÌNH PHÁT NHẠC NỀN CHILL CHẤT LƯỢNG CAO ---
    const bgAudio = new Audio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3');
    bgAudio.loop = true;
    bgAudio.volume = 0.35; // Âm lượng êm dịu

    let isMusicOn = true;

    function toggleMusic() {
      const musicBtn = document.getElementById('musicBtn');
      if (isMusicOn) {
        bgAudio.pause();
        isMusicOn = false;
        musicBtn.innerText = "🎵 Nhạc: Tắt";
      } else {
        bgAudio.play().catch(() => {});
        isMusicOn = true;
        musicBtn.innerText = "🎵 Nhạc: Bật";
      }
    }

    // Tự động bật nhạc khi người dùng tương tác bất kỳ nút nào trên màn hình
    document.body.addEventListener('click', () => {
      if (isMusicOn && bgAudio.paused) {
        bgAudio.play().catch(() => {});
      }
    }, { once: true });

    // --- HIỆU ỨNG ÂM THANH HIỆN ĐẠI ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'cut') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'boom') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
      } else if (type === 'win') {
        [523, 659, 783, 1046].forEach((f, i) => {
          setTimeout(() => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = f; g.gain.setValueAtTime(0.15, audioCtx.currentTime);
            o.start(); o.stop(audioCtx.currentTime + 0.18);
          }, i * 80);
        });
      }
    }

    // --- LOGIC GAME ---
    let coins = 5000;
    let selectedBet = 1;
    let myRole = 'player';
    let myDeadWire = null;
    let oppDeadWire = Math.floor(Math.random() * 10) + 1;
    let isMyTurnToCut = false;

    function selectBet(amount) {
      selectedBet = amount;
      document.querySelectorAll('.btn-bet').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.innerText) === amount);
      });
    }

    function joinGame(role) {
      myRole = role;
      if (role === 'spectator') {
        if (coins < 10) { alert("Bạn không đủ 10 xu phí làm khách!"); return; }
        coins -= 10;
        document.getElementById('userCoins').innerText = coins;
        document.getElementById('statusText').innerText = "👁️ Bạn tham gia với vai trò KHÁN GIẢ (-10 Xu phí).";
        document.getElementById('setupPanel').style.display = 'none';
        return;
      }

      document.getElementById('setupPanel').style.display = 'none';
      document.getElementById('statusText').innerText = "💣 CHỌN DÂY CHẾT CỦA BẠN (Dây 1-10):";
      renderWireGrid(true);
    }

    function renderWireGrid(isSelectingDeadWire) {
      const grid = document.getElementById('wireGrid');
      grid.style.display = 'grid';
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-wire-10';
        btn.innerText = '✂️ Dây ' + i;
        btn.onclick = () => {
          if (isSelectingDeadWire) {
            myDeadWire = i;
            playSound('cut');
            document.getElementById('statusText').innerText = `Dây chết của bạn là DÂY ${i}. Chuẩn bị Oẳn Tù Tì!`;
            grid.style.display = 'none';
            document.getElementById('rpsButtons').style.display = 'flex';
          } else if (isMyTurnToCut) {
            cutEnemyWire(i, btn);
          }
        };
        grid.appendChild(btn);
      }
    }

    function playRPS(myChoice) {
      playSound('cut');
      const choices = ['rock', 'paper', 'scissors'];
      const oppChoice = choices[Math.floor(Math.random() * 3)];
      
      document.getElementById('rpsButtons').style.display = 'none';

      if (myChoice === oppChoice) {
        document.getElementById('statusText').innerText = "HÒA OẮN TÙ TÌ! Hãy ra lại...";
        document.getElementById('rpsButtons').style.display = 'flex';
      } else if (
        (myChoice === 'rock' && oppChoice === 'scissors') ||
        (myChoice === 'paper' && oppChoice === 'rock') ||
        (myChoice === 'scissors' && oppChoice === 'paper')
      ) {
        playSound('win');
        isMyTurnToCut = true;
        document.getElementById('statusText').innerText = `🎉 THẮNG OẮN TÙ TÌ! Chọn 1 dây của đối thủ để CẮT!`;
        renderWireGrid(false);
      } else {
        document.getElementById('statusText').innerText = `❌ THUA OẮN TÙ TÌ! Đối thủ đang chọn cắt dây của bạn...`;
        setTimeout(oppCutMyWire, 2000);
      }
    }

    function cutEnemyWire(wireNum, btnElement) {
      playSound('cut');
      btnElement.disabled = true;
      btnElement.innerText = "❌ Sứt";

      if (wireNum === oppDeadWire) {
        playSound('boom');
        coins += selectedBet;
        document.getElementById('userCoins').innerText = coins;
        document.getElementById('statusText').innerText = `💥 BÙM! Cắt TRÚNG DÂY CHẾT đối thủ! Thắng +${selectedBet} Xu!`;
        document.getElementById('wireGrid').style.display = 'none';
      } else {
        playSound('win');
        document.getElementById('statusText').innerText = `An toàn! Dây ${wireNum} không phải dây chết. Đổi lượt Oẳn Tù Tì!`;
        document.getElementById('wireGrid').style.display = 'none';
        document.getElementById('rpsButtons').style.display = 'flex';
      }
    }

    function oppCutMyWire() {
      const randomWire = Math.floor(Math.random() * 10) + 1;
      playSound('cut');

      if (randomWire === myDeadWire) {
        playSound('boom');
        coins -= selectedBet;
        document.getElementById('userCoins').innerText = coins;
        document.getElementById('statusText').innerText = `💥 BÙM! Đối thủ cắt trúng DÂY CHẾT (${myDeadWire}) của bạn! Bạn OUT thành KHÁN GIẢ!`;
        
        myRole = 'spectator';
        document.getElementById('p1Name').innerText = "Bạn (Khán Giả)";
        document.getElementById('p1Avatar').src = "https://api.dicebear.com/7.x/bottts/svg?seed=Explode&backgroundColor=ff4757";
      } else {
        document.getElementById('statusText').innerText = `Đối thủ cắt Dây ${randomWire} AN TOÀN. Đến lượt bạn Oẳn Tù Tì!`;
        document.getElementById('rpsButtons').style.display = 'flex';
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(window.atob(base64));
    }

    function handleCredentialResponse(response) {
      const userObj = parseJwt(response.credential);
      document.getElementById('authBox').style.display = 'none';
      document.getElementById('p1Name').innerText = userObj.given_name;
      document.getElementById('p1Avatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${userObj.email}&backgroundColor=b6e3f4`;
      playSound('win');
    }
  </script>
</body>
</html>
